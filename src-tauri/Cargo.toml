[package]
name = "project-axiom"
version = "0.1.0"
description = "Project Axiom - Polymorphic Enterprise Core"
authors = ["Axiom Core Engineering"]
edition = "2021"

[lib]
name = "project_axiom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
